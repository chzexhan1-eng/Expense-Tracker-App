version: '3.9'

services:
  # ─── Backend API Server ───────────────────────────────────────────────────
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: expense-tracker-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - JWT_SECRET=your_super_secret_jwt_key_change_this_in_production
      - DATABASE_URL=file:./prisma/dev.db
    volumes:
      # Mount a named volume for the SQLite DB so data persists between restarts
      - sqlite_data:/app/prisma
    networks:
      - app-network

  # ─── Frontend Client (Nginx + React) ─────────────────────────────────────
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: expense-tracker-client
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - server
    networks:
      - app-network

# ─── Named Volumes ────────────────────────────────────────────────────────────
volumes:
  sqlite_data:

# ─── Shared Network ───────────────────────────────────────────────────────────
networks:
  app-network:
    driver: bridge
